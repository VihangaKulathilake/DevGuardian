server:
  port: 8083

spring:
  application:
    name: analysis-service

  datasource:
    url: jdbc:postgresql://localhost:5432/devguardian_analysis
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

devguardian:
  workspace:
    base-path: ../workspace/repos
