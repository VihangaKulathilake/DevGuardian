server:
  port: 8080

spring:
  application:
    name: devguardian-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: monolith-github
          uri: lb://devguardian
          predicates:
            - Path=/api/github/**
        - id: monolith-repos
          uri: lb://devguardian
          predicates:
            - Path=/api/repositories/**
        - id: monolith-analysis
          uri: lb://devguardian
          predicates:
            - Path=/api/analysis/**, /api/ai/**
        - id: monolith-notifications
          uri: lb://devguardian
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
