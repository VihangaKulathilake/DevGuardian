server:
  port: 8082

spring:
  application:
    name: devguardian

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  datasource:
    url: jdbc:postgresql://localhost:5432/devguardian
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: http://localhost:8080/api/github/callback

devguardian:
  workspace:
    base-path: workspace/repos

ai:
  provider: groq

groq:
  api:
    key: ${GROQ_API_KEY}
    model: llama-3.1-8b-instant

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-1.5-flash