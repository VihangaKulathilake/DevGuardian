server:
  port: 8082

spring:
  application:
    name: repository-service
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

  datasource:
    url: jdbc:postgresql://localhost:5432/devguardian_repository
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

devguardian:
  workspace:
    base-path: ../workspace/repos

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: http://localhost:8080/api/github/callback
