server:
  port: 8080

spring:
  application:
    name: devguardian

  datasource:
    url: jdbc:postgresql://localhost:5432/devguardian
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true